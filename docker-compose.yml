services:
  backend:
    build: ./backend
    restart: always
    # Measured peak ~86 MiB (startup + load + export); ~3x margin
    mem_limit: 256m
    memswap_limit: 256m
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/kairos.db
      OBSIDIAN_VAULT_PATH: /vault
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kairos-data:/data
      - ${VAULT_HOST_PATH:-./vault-dev}:/vault
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NODE_BUILD_MEMORY_MB: ${NODE_BUILD_MEMORY_MB:-}
    restart: always
    # Measured peak ~48 MiB under load; ~4x margin
    mem_limit: 192m
    memswap_limit: 192m
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kairos-data:
